# Сборка на Windows и macOS при каждом push и pull request.
# Предупреждения считаются ошибками, поэтому красная галочка = есть предупреждения.
name: build

on:
  push:
  pull_request:

jobs:
  build:
    # Если что-то зависло (например, тест ждёт нажатия кнопки в окне ошибки MSVC),
    # задача прервётся через 15 минут, а не через 6 часов по умолчанию.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DYATZY_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Debug
      # Пока в ScoreCalculator нет проверки кубиков вне диапазона, часть тестов падает.
      # Когда влит PR Пилипенко Дмитрия и все тесты проходят, строку continue-on-error нужно удалить.
      # --timeout 60: зависший тест через минуту считается упавшим.
      - name: Tests
        continue-on-error: true
        run: ctest --test-dir build -C Debug --output-on-failure --timeout 60